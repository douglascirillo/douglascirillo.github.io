name: Rebuild Algolia index
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
concurrency:
  group: rebuild-index
  cancel-in-progress: false
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and swap the site_public index
        env:
          ALGOLIA_APP_ID: AL1TQKLUI7
          ALGOLIA_WRITE_KEY: ${{ secrets.ALGOLIA_WRITE_KEY }}
          SITE_DIR: ${{ github.workspace }}
        run: python3 .github/scripts/build_index.py
